[workspace]
resolver = "3"
members = [
    "crates/tartarus-proto",
    "crates/tartarus-orchestrator",
    "crates/tartarus-agent",
]

# Dependencies get declared here once, then each crate opts in with
# `foo.workspace = true`. Keeps versions from drifting between crates.
[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
