[workspace]
resolver = "3"
members = [
    "crates/tartarus-proto",
    "crates/tartarus-orchestrator",
    "crates/tartarus-agent",
]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

tartarus-proto = { path = "crates/tartarus-proto" }

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
